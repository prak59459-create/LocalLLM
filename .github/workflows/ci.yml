name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift
        run: |
          curl -sSL -o swift.tgz https://download.swift.org/swift-6.1.2-release/ubuntu2404/swift-6.1.2-RELEASE/swift-6.1.2-RELEASE-ubuntu24.04.tar.gz
          mkdir -p "$RUNNER_TEMP/swift"
          tar xzf swift.tgz -C "$RUNNER_TEMP/swift" --strip-components=1
          echo "$RUNNER_TEMP/swift/usr/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python reference implementations
        run: |
          pip install tokenizers jinja2 transformers numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Fetch fixtures from Hugging Face
        run: ./Tools/fetch_fixtures.sh

      - name: Generate expectations
        run: |
          shopt -s nullglob
          for script in Tools/fixtures/*.py; do
            echo "== $script"
            python -I "$script"
          done

      # GGUF の推論を本物のモデル（SmolLM2 135M）で確かめる
      - name: Download a small GGUF model
        run: |
          mkdir -p "$RUNNER_TEMP/gguf"
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gguf/SmolLM2-135M-Instruct-Q4_K_M.gguf" \
            "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf"
          ls -la "$RUNNER_TEMP/gguf"

      - name: Build
        run: swift build

      - name: Test
        env:
          LOCALLLM_LIVE_TESTS: "1"
          LOCALLLM_GGUF_MODELS: ${{ runner.temp }}/gguf
          # アプリの更新の本物の GitHub とのテストで使う（ランナーの IP で共有される回数制限を避ける）
          GITHUB_TOKEN: ${{ github.token }}
        run: swift test

  core-tests-macos:
    name: Core tests (macOS, Accelerate)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      # Accelerate (vDSP) と Compression を使う経路は Apple のプラットフォームでしか動かないので、ここで確かめる
      - name: Fetch fixtures
        run: ./Tools/fetch_fixtures.sh

      # GGUF の推論（Accelerate を使う経路）を本物のモデルで確かめて、速さも測る
      - name: Download small GGUF models
        run: |
          mkdir -p "$RUNNER_TEMP/gguf"
          for f in SmolLM2-135M-Instruct-Q4_K_M.gguf SmolLM2-135M-Instruct-Q8_0.gguf; do
            curl -sSfL --retry 3 -o "$RUNNER_TEMP/gguf/$f" "https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/$f"
          done
          # GPU（Metal）の計算は、速さの目標にしている Qwen2.5 1.5B でも確かめる
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gguf/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          # Gated DeltaNet（Qwen3.5）の Accelerate の経路を確かめる
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gguf/Qwen3.5-0.8B-Q4_K_M.gguf" \
            "https://huggingface.co/unsloth/Qwen3.5-0.8B-GGUF/resolve/main/Qwen3.5-0.8B-Q4_K_M.gguf"
          ls -la "$RUNNER_TEMP/gguf"

      - name: Test
        env:
          LOCALLLM_GGUF_MODELS: ${{ runner.temp }}/gguf
        run: swift test --filter "GGUF|DPMSolver|CLIPText|ImageRepoLayout|VideoFrames|SpeechText|Generation|Sampler|Logits|ZipArchive|SplitModel|Workspace|TextDiff|Roadmap|SyntaxHighlighter|AppUpdater|SHA1|GitHubSource|PackageManifest|UpdateDiff|PackageScanner|AgentContext|MemoryBudget|MemoryTrend|MemoryRecovery|SlimTool|SplitParts|TokenizerSynthesizer|Tool|JSONValue|MCP|ContextResizer|ProtoWire|HalfAndBlob|RopeTable"

      # コンテキスト長を変えた本物のモデルを Core ML で読み込んで、元の長さを超えた位置で推論できるか確かめる
      - name: Download models for the Core ML end-to-end test
        run: |
          set -e
          fetch() {
            local repo="$1" path="$2" out="$3"
            for f in model.mil coremldata.bin metadata.json analytics/coremldata.bin weights/weight.bin; do
              mkdir -p "$out/$(dirname "$f")"
              curl -sSfL --retry 3 -o "$out/$f" "https://huggingface.co/$repo/resolve/main/$path/$f"
            done
          }
          mkdir -p "$RUNNER_TEMP/models"
          fetch finnvoorhees/coreml-Qwen2.5-0.5B-Instruct-4bit Qwen2.5-0.5B-Instruct-4bit.mlmodelc "$RUNNER_TEMP/models/qwen.mlmodelc"
          fetch anemll/anemll-Qwen-Qwen3-0.6B-ctx512_0.3.4 qwen_FFN_PF_lut6_chunk_01of01.mlmodelc "$RUNNER_TEMP/models/anemll.mlmodelc"
          du -sh "$RUNNER_TEMP/models"/*

      - name: Core ML end-to-end test (context resize)
        env:
          LOCALLLM_COREML_MODELS: ${{ runner.temp }}/models
        run: swift test --filter ContextResizeCoreMLTests

  app-typecheck-ios:
    name: App typecheck (iOS SDK)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep Xcode || true
          sudo xcode-select -s /Applications/Xcode_16.4.app || true
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Typecheck all app sources against the iOS 18 SDK
        run: |
          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          find LocalLLM.swiftpm/Sources/AppModule -name '*.swift' | sort > sources.txt
          wc -l $(cat sources.txt) | tail -1
          set +e
          /usr/bin/time -p xcrun --sdk iphonesimulator swiftc -typecheck \
            -sdk "$SDK" \
            -target arm64-apple-ios18.0-simulator \
            -swift-version 5 \
            -parse-as-library \
            -module-name AppModule \
            -Xfrontend -warn-long-function-bodies=100 \
            -Xfrontend -warn-long-expression-type-checking=80 \
            $(cat sources.txt) 2> typecheck.log
          status=$?
          set -e
          grep -E "error:" typecheck.log | head -200 || true
          echo "----- all diagnostics -----"
          cat typecheck.log | tail -400
          exit $status

      # Swift Playgrounds builds without optimization, so slow-to-typecheck code makes the iPad build slow
      # (and can even crash it). Fail if any function body or expression is slow to typecheck.
      # 型チェックは 100ms / 80ms から表示して（余裕の少ない箇所を見つけるため）、
      # 関数 200ms・式 150ms を超えたら失敗にする。
      - name: Check for slow type-checking
        run: |
          grep -E "Sources/AppModule/.*took [0-9]+ms to type-check" typecheck.log | sed -E 's/^.*Sources\/AppModule\///' | sort -u > slow.txt || true
          echo "----- slow-ish (warning only) -----"
          cat slow.txt
          fail=$(awk '
            /expression took/ { match($0, /took [0-9]+ms/); ms = substr($0, RSTART + 5, RLENGTH - 7) + 0; if (ms > 150) print }
            /(function|getter|method|closure|initializer).*took/ && !/expression took/ { match($0, /took [0-9]+ms/); ms = substr($0, RSTART + 5, RLENGTH - 7) + 0; if (ms > 200) print }
          ' slow.txt)
          if [ -n "$fail" ]; then
            echo "$fail"
            echo "::error::Some code is slow to type-check. Split the expression or view into smaller pieces."
            exit 1
          fi
          echo "No slow type-checking over the limits."

      # ビルド時間（Swift Playgrounds と同じく最適化なし・arm64）と、その内訳（段階ごと・ファイルごと・関数ごと）
      - name: Build time report
        continue-on-error: true
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p "$RUNNER_TEMP/objs" "$RUNNER_TEMP/stats"
          sed "s|^|$GITHUB_WORKSPACE/|" sources.txt > "$RUNNER_TEMP/sources.txt"
          start=$(date +%s)
          (cd "$RUNNER_TEMP/objs" && xcrun --sdk iphoneos swiftc -c -Onone -g -enable-batch-mode -j 3 \
            -sdk "$SDK" -target arm64-apple-ios18.0 -swift-version 5 -parse-as-library -module-name AppModule \
            -stats-output-dir "$RUNNER_TEMP/stats" -Xfrontend -debug-time-function-bodies \
            $(cat "$RUNNER_TEMP/sources.txt") > "$GITHUB_WORKSPACE/functions.txt" 2>&1)
          echo "BUILD-TIME: $(( $(date +%s) - start )) s (swiftc, arm64, -Onone -g, batch mode, 3 jobs)"
          python3 Tools/build_time_report.py "$RUNNER_TEMP/stats" functions.txt --top 80

      - name: Build the Swift Playgrounds app package with xcodebuild
        working-directory: LocalLLM.swiftpm
        continue-on-error: true
        run: |
          xcodebuild -list > /dev/null || true
          start=$(date +%s)
          xcodebuild -scheme LocalLLM -destination 'generic/platform=iOS' -showBuildTimingSummary \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 || true
          echo "XCODEBUILD-TIME: $(( $(date +%s) - start )) s (Debug, arm64 iOS device)"
          grep -E "BUILD (SUCCEEDED|FAILED)|error:" build.log | head -20
          sed -n '/Build Timing Summary/,$p' build.log | head -40
